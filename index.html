<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero Operativo BI · Centro de Control Ágil MIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f8;--surf:#fff;--line:#dde4e8;--track:#e8edf0;--ink:#1b2733;--ink2:#3a4855;--mut:#5b6976;--acc:#0f8a7e;--acc2:#0b6b62;--accb:#e3f4f1;--nav:#212844;--gold:#BD955A;--goldt:#8a6630;
--bad:#c42b20;--bad2:#d93a2f;--badb:#fdeeec;--badl:#f0c3bd;--badc:#fdf4f3;--warn:#a35f00;--warnb:#fff3df;--ok:#1f7a4a;--okb:#f0f8f3;--okl:#c4e3d1;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 'IBM Plex Sans',system-ui,sans-serif}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.wrap{max-width:1680px;margin:0 auto;padding:14px 18px 20px;display:flex;flex-direction:column;gap:12px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.brand small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--goldt)}
.brand h1{margin:2px 0 0;font-size:20px;font-weight:700}
.brand span{font-size:12px;color:var(--mut)}
.dn{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.dn b{font-family:var(--mono);font-size:22px;font-weight:600}
.dn span{font-size:12px;color:var(--mut);line-height:1.2}
.bars{flex:1 1 260px;min-width:220px;display:flex;flex-direction:column;gap:4px}
.bars .l{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.bars .l b{font-family:var(--mono);font-weight:600}
.trk{height:8px;background:var(--track);border-radius:4px;overflow:hidden}.trk i{display:block;height:100%;border-radius:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--surf);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed=true]{border-color:var(--acc);background:var(--accb);color:var(--acc2)}
.seg.ph button[aria-pressed=true]{border-color:var(--nav);background:var(--nav);color:#fff}
.seg button:focus-visible,.card:focus-visible,.lnk:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.corte{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:right;line-height:1.5}
.corte a{color:var(--acc2);font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12.5px;text-decoration:none}
.grid{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:12px;align-items:start}
.rail{display:flex;flex-direction:column;gap:10px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.tile .k{font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.tile .v{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1.15}
.tile .s{font-size:12px;color:var(--mut)}
.tile.bad{background:var(--badb);border-color:var(--badl)}.tile.bad .v{color:var(--bad)}
.wip{display:flex;gap:4px;margin-top:6px}.wip i{flex:1;height:6px;border-radius:3px;background:var(--track)}.wip i.on{background:var(--acc)}.wip i.over{background:var(--bad2)}
.hl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0}.hl b{font-family:var(--mono);font-weight:600}
.kb{background:var(--surf);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kh,.kr{display:grid;grid-template-columns:104px repeat(4,minmax(0,1fr))}
.kh>div{padding:10px 12px;font-size:12px;font-weight:700;letter-spacing:.05em;border-left:1px solid var(--line)}.kh>div:first-child{border-left:0;color:var(--mut)}
.kh{border-bottom:1px solid var(--line)}
.kr{border-bottom:1px solid var(--line);min-height:120px}.kr:last-child{border-bottom:0}
.kr>div{padding:8px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px}.kr>div:first-child{border-left:0;padding:12px}
.c-bloq{background:var(--badc)}
.eqn{font-weight:700;font-size:14px}.eqs{font-family:var(--mono);font-size:12px}.eqx{font-size:11px;color:var(--mut)}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--surf);border:1px solid #d3dbe1;border-left:3px solid var(--line);border-radius:6px;padding:8px 10px;min-height:44px}
.card:hover{box-shadow:0 1px 6px rgba(20,40,60,.12)}
.card .n{font-size:12.5px;font-weight:600;line-height:1.3}
.card .m{display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:11px;color:var(--mut)}
.card .w{font-size:11px;color:var(--bad)}
.card.bloq{border-color:var(--badl);border-left-color:var(--bad2)}
.card.hecha{background:var(--okb);border-color:var(--okl);border-left-color:var(--ok)}.card.hecha .n{color:#1f5e3a}
.card.adel{border-style:dashed;border-left-style:solid}
.card.cr{border-left-color:var(--bad2)}.card.cy{border-left-color:#e0a030}.card.cg{border-left-color:var(--ok)}
.pb{display:flex;align-items:center;gap:8px}.pb .trk{flex:1;height:4px}.pb .trk i{background:var(--acc)}.pb span{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.r{color:var(--bad)}.y{color:var(--warn)}.g{color:var(--ok)}
.empty{font-size:12.5px;color:var(--mut);padding:18px}
.imp{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--line)}.imp:first-of-type{border-top:0}
.imp .t{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600}
.imp .t span{font-family:var(--mono);font-size:11px;color:var(--mut);font-weight:500}
.age{height:6px;border-radius:3px;background:var(--track);overflow:hidden}.age i{display:block;height:100%}
.age.nd{background:none;border:1px dashed #9aa5b1}
.imp .x{font-family:var(--mono);font-size:11px}
.lnk{all:unset;cursor:pointer;color:var(--acc2);font-size:12px;font-weight:600}
.rad{display:flex;align-items:center;gap:10px;padding:5px 0}.rad b{font-family:var(--mono);font-size:17px;font-weight:600;width:56px;flex:none}.rad span{font-size:12.5px;line-height:1.3}.rad small{display:block;color:var(--mut);font-size:11.5px}
.tl{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 18px}
.tlh{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;color:var(--mut);margin-bottom:8px}
.tlb{position:relative;height:74px}
.hb{position:absolute;top:4px;height:20px;border-radius:4px;font-size:11px;padding:2px 8px;overflow:hidden;white-space:nowrap;border:1px solid #b4bfc8;background:var(--track);color:var(--ink2)}
.hb.ep{border-color:var(--acc);background:#e0f2ef;color:var(--acc2)}.hb.co{border-color:var(--okl);background:var(--okb);color:var(--ok)}
.axis{position:absolute;left:0;right:0;top:38px;height:2px;background:var(--line)}
.dm{position:absolute;top:33px;width:11px;height:11px;margin-left:-5.5px;transform:rotate(45deg);border:0;padding:0;cursor:pointer}
.today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--gold)}
.tlab{position:absolute;top:50px;font-family:var(--mono);font-size:11px;white-space:nowrap}
.foot{font-size:11.5px;color:var(--mut);text-align:center}
#dr{position:fixed;inset:0;background:rgba(20,30,45,.35);display:none;z-index:20}
#dr.on{display:block}
#dp{position:absolute;right:0;top:0;bottom:0;width:min(440px,94vw);background:var(--surf);border-left:4px solid var(--gold);overflow:auto;padding:18px 20px;box-shadow:-4px 0 18px rgba(0,0,0,.12)}
#dp h2{margin:4px 0 2px;font-size:18px}
#dp .id{font-family:var(--mono);font-size:12px;color:var(--mut)}
#dp dl{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px;margin:14px 0}
#dp dt{color:var(--mut)}#dp dd{margin:0}
#dp h3{font-size:13px;margin:14px 0 6px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
#dp ul{margin:0;padding-left:18px;font-size:13px}#dp li{margin-bottom:4px}
.close{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surf);cursor:pointer;font-weight:600;float:right}
@media(max-width:1200px){.grid{grid-template-columns:1fr}.rail{flex-direction:row;flex-wrap:wrap}.rail>.tile{flex:1 1 180px}}
@media(max-width:760px){.kh{display:none}.kr{grid-template-columns:1fr}.kr>div{border-left:0;border-top:1px dashed var(--line)}.kr>div:first-child{border-top:0}.kr>div[data-c]::before{content:attr(data-c);font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--mut)}.kr>div[data-c]:not(:has(.card)){display:none}}

.gbtn{position:fixed;right:0;top:46%;z-index:15;transform-origin:right bottom;transform:rotate(-90deg);border:0;border-radius:8px 8px 0 0;background:var(--nav);color:#fff;border-bottom:3px solid var(--gold);padding:8px 16px;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);min-height:40px}
.gbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#gt{position:fixed;inset:0;background:rgba(20,30,45,.35);display:none;z-index:18;padding:18px}
#gt.on{display:block}
#gp{background:var(--surf);border-radius:12px;border-top:4px solid var(--gold);max-width:1560px;margin:0 auto;height:100%;display:flex;flex-direction:column;overflow:hidden}
.gh{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.gh h2{margin:0;font-size:17px}.gh .s{font-size:12px;color:var(--mut)}
.gb{flex:1;overflow:auto;padding:0 18px 16px}
.gg{display:grid;grid-template-columns:330px minmax(560px,1fr);min-width:900px}
.gax{position:sticky;top:0;background:var(--surf);z-index:2;border-bottom:2px solid var(--gold)}
.gax .lab{padding:10px 0;font-size:11px;letter-spacing:.06em;color:var(--mut)}
.gax .sc{position:relative;height:34px}
.gax .mt{position:absolute;top:10px;font-family:var(--mono);font-size:11px;color:var(--mut);padding-left:4px;border-left:1px solid var(--line);height:24px}
.grow{display:contents}
.gn{padding:6px 10px 6px 0;font-size:12.5px;border-bottom:1px solid #eef2f4;display:flex;flex-direction:column;justify-content:center;min-height:38px}
.gn.h{font-weight:700;color:var(--nav);background:#f7f9fa;padding-left:6px}
.gn.t{padding-left:18px}
.gn small{font-family:var(--mono);font-size:10.5px;color:var(--mut);font-weight:400}
.gn button{all:unset;cursor:pointer;line-height:1.3}.gn button:hover{color:var(--acc2);text-decoration:underline}.gn button:focus-visible{outline:2px solid var(--acc)}
.gc{position:relative;border-bottom:1px solid #eef2f4;min-height:38px}
.gc.h{background:#f7f9fa}
.gbar{position:absolute;top:11px;height:16px;border-radius:4px;border:1px solid #b4bfc8;background:var(--track);overflow:hidden;cursor:pointer;padding:0}
.gbar i{position:absolute;left:0;top:0;bottom:0}
.gbar.hecha{border-color:var(--okl);background:var(--okb)}.gbar.hecha i{background:#7cc79e}
.gbar.curso{border-color:#7fc6bd;background:#e0f2ef}.gbar.curso i{background:var(--acc)}
.gbar.bloq{border-color:var(--badl);background:var(--badb)}.gbar.bloq i{background:var(--bad2)}
.gbar.hacer i{background:#9aa5b1}
.gbar.adel{border-style:dashed}
.ghb{position:absolute;top:13px;height:12px;border-radius:3px;background:var(--nav);opacity:.85}
.ghb.ep{background:var(--acc)}.ghb.co{background:var(--ok)}.ghb.pe{background:#b4bfc8}
.gdm{position:absolute;top:13px;width:11px;height:11px;margin-left:-5.5px;transform:rotate(45deg);background:var(--nav)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--gold);z-index:1;pointer-events:none}
.gleg{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--mut)}.gleg i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
@media(max-width:760px){.gbtn{top:auto;bottom:12px;right:12px;transform:none;border-radius:8px}#gt{padding:0}#gp{border-radius:0}}

header.top .hrow{flex:1 1 100%;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.brand h1{margin:0;font-size:22px;font-weight:700;color:var(--ink)}
.brand .org{margin-top:3px;font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--mut)}
.brand .fz{margin-top:4px;font-size:14px;font-weight:600;color:var(--acc2)}
.logo{height:40px;width:auto;flex:none}
.hito{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;background:#fff1dc;border:1px solid #f5c27a;border-left:5px solid #f0a23a;border-radius:10px;padding:10px 16px}
.hito .hk{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a4b00}
.hito b{font-size:15px;color:#4a2a00}
.hito .hm{font-family:var(--mono);font-size:12px;color:#7a4a10}
@media(max-width:760px){.logo{height:30px}.brand h1{font-size:18px}}

.band{background:var(--nav);border-bottom:3px solid var(--gold);color:#fff}
.bandin{max-width:1680px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.band .brand h1{color:#fff}
.band .brand .org{color:#d9c29b}
.band .brand .fz{color:#fff;opacity:.92}
.band .logo{background:#fff;padding:5px 9px;border-radius:8px;height:44px}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.eqbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.eql{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.phw{position:relative;display:inline-block}
.pop{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:12;width:360px;background:var(--surf);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:10px;box-shadow:0 8px 24px rgba(20,30,45,.18);padding:10px 12px;text-align:left}
.pop::before{content:"";position:absolute;top:-11px;left:0;right:0;height:11px}
.phw:hover .pop,.phw:focus-within .pop{display:block}
.pop .ph{font-weight:700;font-size:13px;color:var(--nav);padding-bottom:6px;border-bottom:1px solid var(--line)}.pop .ph span{display:block;font-weight:400;font-size:11.5px;color:var(--mut);font-family:var(--mono)}
.pi{display:flex;gap:8px;padding:7px 6px;border-bottom:1px solid #eef2f4;border-radius:6px}.pi>i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:#b4bfc8}.pi>i.co{background:var(--ok)}.pi>i.ep{background:#f0a23a}
.pi b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}.pi small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-top:2px}
.pi.cur{background:#fff1dc;border:1px solid #f5c27a}
.pf{font-size:11.5px;color:var(--mut);padding-top:6px}
footer.foot{background:var(--nav);border-top:3px solid var(--gold);color:#d7dbe8;font-size:12px;text-align:center;padding:10px 16px;margin-top:4px}
@media(max-width:760px){.bandin{padding:12px 14px}.band .logo{height:32px}.pop{left:0;transform:none;width:min(320px,88vw)}}

.rsb{all:unset;cursor:pointer;color:var(--acc2);font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12.5px;min-height:28px}
.rsb:focus-visible{outline:2px solid var(--acc)}
#rs{position:fixed;inset:0;background:rgba(20,30,45,.35);display:none;z-index:19;padding:18px;overflow:auto}
#rs.on{display:block}
#rp{background:var(--surf);max-width:1180px;margin:0 auto;border-radius:12px;border-top:4px solid var(--gold);padding:14px 20px 20px}
.rsh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.rsa{display:flex;flex-wrap:wrap;gap:8px}.rsa .close{float:none}
.rst{background:var(--nav);color:#fff;border-bottom:3px solid var(--gold);border-radius:8px;padding:12px 16px}
.rsk{font-size:11px;letter-spacing:.1em;color:#d9c29b;text-transform:uppercase;font-weight:600}
.rst h2{margin:4px 0 2px;font-size:18px}.rsm{font-size:12px;color:#d7dbe8}
.rsc{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0;font-size:13px}.rsc b{font-family:var(--mono)}
.rse{margin-top:14px;break-inside:avoid}
.rse h3{margin:0 0 6px;font-size:15px;color:var(--nav)}.rse h3 span{font-weight:400;font-size:12px;color:var(--mut)}
.rse table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}.rse th:nth-child(1){width:34%}.rse th:nth-child(2),.rse th:nth-child(3){width:9%}.rse th:nth-child(4),.rse th:nth-child(5){width:7%}.rse th:nth-child(6){width:11%}.rse td.mono small{white-space:nowrap}
.rse th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--gold);padding:6px}
.rse td{border-bottom:1px solid #e8eded;padding:7px 6px;vertical-align:top}.rse td small{display:block;color:var(--mut);font-size:11px}
.est{display:inline-block;font-weight:700;font-size:11.5px;border-radius:99px;padding:2px 9px;white-space:nowrap}
.est.g{background:var(--okb);color:var(--ok)}.est.y{background:var(--warnb);color:var(--warn)}.est.r{background:var(--badb);color:var(--bad)}
.rsn{font-size:11.5px;color:var(--mut);margin-top:14px}
@media(max-width:760px){#rs{padding:0}#rp{border-radius:0}.rse table{display:block;overflow-x:auto}}
@media print{html,body{background:#fff!important}body>*:not(#rs){display:none!important}#rs{display:block!important;position:static;background:none;padding:0}#rp{max-width:none;border:0;padding:0}.noprint{display:none!important}.rst,.est{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4 landscape;margin:12mm}}
</style>

function estRS(t){if(t.estado==="Completada")return ["Terminada","g"];const n=t.fin?dd(t.fin,REF):null;if(n!=null&&n<0)return ["Vencida","r"];const g=gap(t);if(g==null)return ["Sin fecha","y"];if(g<=-U2)return ["En retraso","r"];if(g<=-U1)return ["En riesgo","y"];return ["A tiempo","g"]}

  return `<section class="rse"><h3>${e}${EQN[e]?` <span>${EQN[e]}</span>`:""}</h3><table><thead><tr><th>Tarea</th><th>Inicio</th><th>Fin plan</th><th>Avance</th><th>Tiempo</th><th>Estado al corte</th><th>Impedimentos</th></tr></thead><tbody>${rows}</tbody></table></section>`}).join("");
 const chips=["A tiempo","En riesgo","En retraso","Vencida","Terminada","Sin fecha"].filter(k=>tot[k]).map(k=>`<span><b>${tot[k]}</b> ${({"A tiempo":"a tiempo","En riesgo":"en riesgo","En retraso":"en retraso","Vencida":tot[k]===1?"vencida":"vencidas","Terminada":tot[k]===1?"terminada":"terminadas","Sin fecha":"sin fecha"})[k]}</span>`).join("");
 $("rp").innerHTML=`<div class="rsh noprint"><div class="seg" role="group" aria-label="Equipo del resumen">${["Todos"].concat(EQ,["Sin asignar"]).map(e=>`<button type="button" data-rs="${e}" aria-pressed="${e===rsEq}">${e}</button>`).join("")}</div><div class="rsa"><button type="button" class="close" id="rpdf">Imprimir / guardar PDF</button><button type="button" class="close" id="rcsv">Descargar CSV</button><button type="button" class="close" id="rx">Cerrar</button></div></div>
 <div class="rsdoc"><div class="rst"><div><div class="rsk">Centro de Control Ágil · Modelo de Inteligencia Territorial</div><h2>Resumen operativo · Fase ${esc(f.id)} ${esc(f.nombre||"")}${rsEq!=="Todos"?" · "+esc(rsEq):""}</h2><div class="rsm">Corte ${fdy(DATA.corte)} · Vicerrectoría General de Sedes • UNIMINUTO</div></div></div>
 <div class="rsc">${chips||"<span>Sin tareas</span>"}</div>
 ${blocks||`<p>Sin tareas para este filtro.</p>`}
 <p class="rsn">Estado al corte: Vencida = pasó su fecha fin sin terminar · En retraso = el avance va ${Math.round(U2*100)} puntos o más por debajo del tiempo transcurrido · En riesgo = entre ${Math.round(U1*100)} y ${Math.round(U2*100)} puntos por debajo · A tiempo = dentro de ${Math.round(U1*100)} puntos. Umbrales por validar. Fuente: Excel Seguimiento_BI_MIT.</p></div>`;
 $("rx").onclick=()=>{$("rs").classList.remove("on");$("rsb").focus()};
 $("rpdf").onclick=()=>window.print();
 $("rcsv").onclick=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`,rows=[["Equipo","ID","Tarea","Hito","Inicio","Fin plan","Fin real","Avance %","Tiempo %","Estado al corte","Impedimentos abiertos","Corte"]];
  tk.filter(t=>rsEq==="Todos"||(t.resp||"Sin asignar")===rsEq).forEach(t=>rows.push([t.resp||"Sin asignar",t.id,t.nombre,(HX[t.hito]||{}).nombre||t.hito,t.inicio,t.fin,t.finReal,Math.round(t.av),t.tiempo==null?"":Math.round(t.tiempo*100),estRS(t)[0],IMP.filter(i=>i.tarea===t.id&&i.estado==="Abierto").map(i=>i.desc).join("; "),DATA.corte]));
  const blob=new Blob(["﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=`Resumen_operativo_${st.f}_${rsEq.replace(/\s/g,"_")}_${DATA.corte}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};
